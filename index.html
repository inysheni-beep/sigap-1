<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAP - Monitoring Salinitas Lahan Pesisir</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet CSS & JS (Peta Satelit Real) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen font-sans">

    <!-- ==================== HALAMAN LOGIN & REGISTRASI ==================== -->
    <div id="auth-page" class="flex min-h-screen items-center justify-center p-4 bg-slate-900">
        <div class="w-full max-w-md bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8 border border-white/20">
            
            <!-- Logo & Brand Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-emerald-600 rounded-2xl text-white shadow-lg mb-3">
                    <i data-lucide="sprout" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">SIGAP Indramayu</h1>
                <p class="text-xs text-slate-500 mt-1">Sistem Monitoring Salinitas IoT Real-time<br><span class="text-emerald-600 font-semibold">Desa Eretan Wetan</span></p>
            </div>

            <!-- Form Login -->
            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email / Username</label>
                    <input type="email" required placeholder="nama@instansi.go.id" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Kata Sandi</label>
                    <input type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500">
                </div>

                <!-- Pilihan Role Stakeholder -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Peran Stakeholder</label>
                    <select id="roleSelect" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500">
                        <option value="" disabled selected>Pilih Peran Stakeholder...</option>
                        <option value="dinas">Dinas Pertanian Indramayu</option>
                        <option value="penyuluh">Penyuluh Pertanian Lapangan</option>
                        <option value="autp">Petugas Asuransi AUTP</option>
                        <option value="peneliti">Peneliti / Akademisi</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold shadow-lg transition-all flex items-center justify-center gap-2">
                    <span>Masuk ke Dashboard</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500 border-t pt-4">
                Belum memiliki akun? <button onclick="toggleRegisterModal()" class="text-emerald-600 font-semibold hover:underline">Buat Akun Baru</button>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT UNTUK ROUTING PERAN -->
    <script>
        lucide.createIcons();

        function handleLogin(e) {
            e.preventDefault();
            const selectedRole = document.getElementById('roleSelect').value;
            if(!selectedRole) return alert('Pilih peran stakeholder!');
            
            // Sembunyikan Halaman Login & Tampilkan Dashboard Sesuai Role
            document.getElementById('auth-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');

            // Aktifkan tampilan spesifik role (dinas, penyuluh, autp, peneliti)
            showRoleView(selectedRole);
        }
    </script>
</body>
</html>
