<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIGAP Indramayu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B1E1C',  // Warna hijau gelap ala sidebar dashboard TERAS
                            accent: '#10B981',// Warna hijau emerald accent
                            hover: '#059669',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

    <!-- Background Decoration / Glowing Effect -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-teal-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-md z-10">
        <!-- Main Card Container -->
        <div class="bg-brand-dark/90 backdrop-blur-md border border-slate-800 rounded-2xl shadow-2xl p-8">
            
            <!-- Header Section (Logo & Title) -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-leaf text-2xl text-emerald-400"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-white tracking-wider">SIGAP</h1>
                <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Monitoring Salinitas Real-Time</p>
                <p class="text-xs text-emerald-400 font-medium mt-1">Desa Eretan Wetan, Indramayu</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- Input Username/Email -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2" for="username">
                        Username / NIP / Email
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" id="username" required
                            class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
                            placeholder="Masukkan akun Anda">
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2" for="password">
                        Kata Sandi
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" id="password" required
                            class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Role Selector (Penting untuk RBAC) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2" for="role">
                        Masuk Sebagai (Stakeholder)
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-user-shield text-sm"></i>
                        </span>
                        <select id="role" required
                            class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl py-3 pl-10 pr-10 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all appearance-none cursor-pointer">
                            <option value="" disabled selected class="bg-slate-900 text-slate-400">-- Pilih Peran Anda --</option>
                            <option value="penyuluh" class="bg-slate-900">1. Penyuluh Pertanian</option>
                            <option value="dinas" class="bg-slate-900">2. Dinas Pertanian Indramayu</option>
                            <option value="autp" class="bg-slate-900">3. Petugas Asuransi AUTP</option>
                            <option value="akademisi" class="bg-slate-900">4. Peneliti / Akademisi</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-emerald-500 focus:ring-0 focus:ring-offset-0">
                        <span>Ingat Saya</span>
                    </label>
                    <a href="#" class="text-emerald-400 hover:underline">Lupa password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all transform active:scale-[0.98] flex items-center justify-center space-x-2">
                    <span>Masuk ke Dashboard</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>

            <!-- Footer Note -->
            <div class="mt-8 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
                <p>IoT Salinity Early Warning System</p>
                <p class="mt-1">&copy; 2026 SIGAP Indramayu</p>
            </div>
        </div>
    </main>

    <!-- JavaScript Handling Redirect Simulation -->
    <script>
        function handleLogin(event) {
            event.preventDefault();

            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value;

            if(!role) {
                alert('Silakan pilih peran stakeholder terlebih dahulu!');
                return;
            }

            // Simpan role ke localStorage agar halaman dashboard tahu role pengguna
            localStorage.setItem('userRole', role);
            localStorage.setItem('userName', username);

            // Simulasi pengalihan halaman (redirect) berdasarkan role
            alert(`Login Berhasil!\nSelamat datang ${username}. Anda masuk sebagai ${role.toUpperCase()}`);
            
            // Nantinya di GitHub Pages kamu bisa arahkan ke file dashboard masing-masing:
            /*
            switch(role) {
                case 'penyuluh':
                    window.location.href = 'dashboard-penyuluh.html';
                    break;
                case 'dinas':
                    window.location.href = 'dashboard-dinas.html';
                    break;
                case 'autp':
                    window.location.href = 'dashboard-autp.html';
                    break;
                case 'akademisi':
                    window.location.href = 'dashboard-akademisi.html';
                    break;
            }
            */
        }
    </script>
</body>
</html>
