<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERAS - Dashboard Stakeholder IoT Salinitas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet CSS & JS for Satellite Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- TOP NAVIGATION BAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center w-10 h-10 bg-emerald-600 rounded-xl text-white shadow-md">
                        <i data-lucide="sprout" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-900 text-lg">TERAS</span>
                            <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full" id="roleBadge">Penyuluh Pertanian</span>
                        </div>
                        <p class="text-[10px] text-slate-500 font-medium">Eretan Wetan, Indramayu • Real-Time Salinity IoT</p>
                    </div>
                </div>

                <!-- Mode Switcher & Profile -->
                <div class="flex items-center gap-3">
                    <div class="hidden sm:flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
                        <i data-lucide="users" class="w-4 h-4 text-slate-500"></i>
                        <span class="text-xs text-slate-500 font-medium">Mode Tampilan:</span>
                        <select id="roleSwitcher" onchange="switchRoleView(this.value)" class="bg-transparent text-xs font-bold text-slate-800 focus:outline-none cursor-pointer">
                            <option value="penyuluh" selected>2. Penyuluh Pertanian</option>
                            <option value="dinas">1. Dinas Pertanian</option>
                            <option value="autp">3. Petugas AUTP</option>
                            <option value="peneliti">4. Peneliti / Akademisi</option>
                        </select>
                    </div>

                    <a href="index.html" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all" title="Keluar / Logout">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA AKAN DISESUAIKAN SECARA DINAMIS OLEH JAVASCRIPT -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        <!-- Tampilan Dinas, Penyuluh, AUTP, Peneliti dimuat di sini -->
    </main>

    <script>
        lucide.createIcons();
        // Logika routing dan pendukung peta/grafik lengkap ada pada file terlampir
    </script>
</body>
</html>
